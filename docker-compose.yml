services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasumkm-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kasumkm
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - kasumkm-network

  db:
    image: mysql:8.0
    container_name: kasumkm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kasumkm
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - kasumkm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kasumkm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - kasumkm-network

networks:
  kasumkm-network:
    driver: bridge

volumes:
  mysql-data:

